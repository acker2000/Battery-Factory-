
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battery Factory 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#202830;color:white;font-family:Arial}
canvas{display:block}
#ui{position:fixed;top:14px;left:14px;z-index:5;pointer-events:none}
#ui h2{margin:0 0 8px;font-size:19px}
#info{background:#202830;padding:10px;border-radius:9px}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202830;padding:12px;border-radius:10px;z-index:5;text-align:center;font-size:13px;width:max-content;max-width:80%}
#look{position:fixed;inset:0;z-index:2;touch-action:none}
#move{position:fixed;left:12px;bottom:65px;z-index:6;display:grid;grid-template-columns:48px 48px 48px;gap:5px}
button{border:0;border-radius:10px;background:#354656;color:white;padding:13px;font-size:18px;touch-action:none}
#forward{grid-column:2}
#left{grid-column:1;grid-row:2}
#back{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#take{position:fixed;right:15px;bottom:65px;z-index:6;background:#167fc0}
#error{position:fixed;top:100px;left:10px;right:10px;color:white;background:#9b2525;padding:12px;z-index:20;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="ui">
<h2>🔋 BATTERY FACTORY</h2>
<div id="info">Ячейки 21700: <span id="count">0</span></div>
</div>
<div id="hint">Добро пожаловать в мастерскую!</div>
<div id="look"></div>
<div id="move">
<button id="forward">▲</button>
<button id="left">◀</button>
<button id="back">▼</button>
<button id="right">▶</button>
</div>
<button id="take">ВЗЯТЬ</button>
<div id="error"></div>

<script type="module">
const errorBox=document.getElementById('error');
function showError(e){
errorBox.style.display='block';
errorBox.textContent='Ошибка 3D: '+(e.message||e);
}
window.addEventListener('error',e=>showError(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showError(e.reason));

async function start(){
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82919c);
scene.fog=new THREE.Fog(0x82919c,18,35);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.7,5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x65717a,2.2));

const light=new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(3,8,5);
light.castShadow=true;
scene.add(light);

function box(w,h,d,x,y,z,color){
const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color,roughness:.75})
);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
scene.add(mesh);
return mesh;
}

// Пол
box(20,.2,20,0,-.1,0,0x626b70);

// Стены
box(20,5,.2,0,2.5,-8,0xd1d6d9);
box(.2,5,16,-8,2.5,0,0xb5bec4);
box(.2,5,16,8,2.5,0xb5bec4);

// Потолочные балки
box(16,.15,.15,0,4.8,-2,0x68747c);
box(16,.15,.15,0,4.8,3,0x68747c);

// Рабочий стол
box(4,.18,2,0,1,-1,0x343e47);
box(3.8,.9,1.8,0,.48,-1,0x69747b);

for(const x of [-1.7,1.7]){
for(const z of [-1.7,-.3]){
box(.12,.9,.12,x,.45,z,0x303940);
}
}

// Ячейки 21700
function makeCell(x,z){
const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.29,.29,1.35,24),
new THREE.MeshStandardMaterial({
color:0x263c4c,
metalness:.55,
roughness:.3
})
);
group.add(body);

const top=new THREE.Mesh(
new THREE.CylinderGeometry(.21,.21,.08,24),
new THREE.MeshStandardMaterial({
color:0xd5d9dc,
metalness:.8
})
);
top.position.y=.7;
group.add(top);

const ring=new THREE.Mesh(
new THREE.TorusGeometry(.24,.025,8,24),
new THREE.MeshStandardMaterial({
color:0xd6a33b,
metalness:.7
})
);
ring.rotation.x=Math.PI/2;
ring.position.y=.66;
group.add(ring);

group.position.set(x,1.48,z);
scene.add(group);
return group;
}

const cells=[];
for(let i=0;i<5;i++){
cells.push(makeCell(-1.25+i*.62,-1));
}

let collected=0;
let rotation=0;
const move={forward:false,back:false,left:false,right:false};

function control(id,key){
const button=document.getElementById(id);
button.addEventListener('pointerdown',e=>{
e.preventDefault();
move[key]=true;
button.setPointerCapture(e.pointerId);
});
button.addEventListener('pointerup',()=>move[key]=false);
button.addEventListener('pointercancel',()=>move[key]=false);
}
control('forward','forward');
control('back','back');
control('left','left');
control('right','right');

// Поворот камеры
let dragging=false,lastX=0;
const look=document.getElementById('look');
look.addEventListener('pointerdown',e=>{
if(e.target.closest('button'))return;
dragging=true;
lastX=e.clientX;
});
look.addEventListener('pointermove',e=>{
if(!dragging)return;
rotation-=(e.clientX-lastX)*.005;
lastX=e.clientX;
});
look.addEventListener('pointerup',()=>dragging=false);
look.addEventListener('pointercancel',()=>dragging=false);

// Взять ячейку
document.getElementById('take').onclick=()=>{
if(!cells.length){
document.getElementById('hint').textContent='Ячейки закончились!';
return;
}
const cell=cells.pop();
scene.remove(cell);
collected++;
document.getElementById('count').textContent=collected;
document.getElementById('hint').textContent='Ячейка 21700 взята!';
};

function animate(){
requestAnimationFrame(animate);

const speed=.055;
const direction=new THREE.Vector3();

if(move.forward)direction.z-=speed;
if(move.back)direction.z+=speed;
if(move.left)direction.x-=speed;
if(move.right)direction.x+=speed;

direction.applyAxisAngle(new THREE.Vector3(0,1,0),rotation);
camera.position.add(direction);

camera.position.x=THREE.MathUtils.clamp(camera.position.x,-7,7);
camera.position.z=THREE.MathUtils.clamp(camera.position.z,-7,7);
camera.position.y=1.7;

camera.rotation.set(0,rotation,0);
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
}catch(e){
showError(e);
}
}

start();
</script>
</body>
</html>
