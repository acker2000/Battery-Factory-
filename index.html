
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Character</title>

<style>
* { box-sizing:border-box; }
body {
 margin:0;
 overflow:hidden;
 background:#25272b;
 font-family:Arial,sans-serif;
}
canvas { display:block; }
#info {
 position:fixed;
 top:15px;
 left:15px;
 color:white;
 background:#111a;
 padding:12px 16px;
 border-radius:10px;
 font-size:14px;
 pointer-events:none;
}
</style>

<script type="importmap">
{
 "imports": {
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="info">3D CHARACTER · Перетаскивай для вращения</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x25272b);

const camera = new THREE.PerspectiveCamera(
 35, window.innerWidth/window.innerHeight, 0.1, 100
);
camera.position.set(3.8,2.8,8);

const renderer = new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.65,0);
controls.enableDamping=true;
controls.minDistance=3;
controls.maxDistance=12;
controls.maxPolarAngle=Math.PI/2;

scene.add(new THREE.HemisphereLight(0xffffff,0x554455,2));

const light = new THREE.DirectionalLight(0xffffff,3);
light.position.set(4,8,6);
light.castShadow=true;
scene.add(light);

const fill = new THREE.DirectionalLight(0xffd9d0,1.2);
fill.position.set(-5,4,-4);
scene.add(fill);

function material(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({
  color,roughness,metalness
 });
}

const skin=material(0xf0c3aa);
const skinDark=material(0xd99e87);
const hair=material(0x493023);
const hairLight=material(0x68412f);
const black=material(0x151515);
const denim=material(0x343c49);
const white=material(0xe9e9e9);
const blue=material(0x3989c6,.22);
const iris=material(0x367ba5,.25);
const dark=material(0x211b19);
const metal=material(0xc5cbd0,.25,.8);
const lips=material(0xb96f70);

const character=new THREE.Group();
 // ORIGINAL FACE REFERENCE
const textureLoader = new THREE.TextureLoader();

textureLoader.load(
  './face-reference.jpg',
  (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace;

    const referenceMaterial = new THREE.MeshBasicMaterial({
      map: texture,
      side: THREE.DoubleSide
    });

    const reference = new THREE.Mesh(
      new THREE.PlaneGeometry(1.5, 2),
      referenceMaterial
    );

    reference.position.set(-1.5, 2.2, 0);
    scene.add(reference);
  },
  undefined,
  (error) => {
    console.error('Ошибка загрузки фотографии:', error);
  }
);
scene.add(character);

function sphere(parent,x,y,z,sx,sy,sz,mat){
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(1,32,24),mat
 );
 mesh.position.set(x,y,z);
 mesh.scale.set(sx,sy,sz);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

function cylinderBetween(parent,a,b,r1,r2,mat){
 const start=new THREE.Vector3(...a);
 const end=new THREE.Vector3(...b);
 const direction=new THREE.Vector3().subVectors(end,start);
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(r2,r1,direction.length(),20),
  mat
 );
 mesh.position.copy(start).add(end).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),direction.normalize()
 );
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

// BODY
// Torso
sphere(character,0,1.58,0,.31,.48,.19,skin);

// Neck
cylinderBetween(character,[0,1.91,0],[0,2.13,0],.105,.11,skin);

// Black top
sphere(character,0,1.62,.015,.325,.32,.205,black);

// Waist
sphere(character,0,1.18,0,.27,.16,.17,skin);

// Denim shorts
sphere(character,0,1.08,0,.30,.19,.21,denim);

// Shorts legs
sphere(character,-.15,.99,.015,.145,.18,.17,denim);
sphere(character,.15,.99,.015,.145,.18,.17,denim);

// Belt
const belt=new THREE.Mesh(
 new THREE.TorusGeometry(.245,.018,8,40),
 material(0x25201c)
);
belt.position.set(0,1.19,0);
belt.rotation.x=Math.PI/2;
character.add(belt);

// Arms
for(const side of [-1,1]){
 const x=side;

 cylinderBetween(
  character,[x*.31,1.85,0],
  [x*.40,1.48,.015],.085,.065,skin
 );

 sphere(character,x*.40,1.46,.015,.068,.075,.07,skin);

 cylinderBetween(
  character,[x*.40,1.46,.015],
  [x*.43,1.12,.07],.065,.045,skin
 );

 sphere(character,x*.43,1.08,.075,.052,.075,.045,skin);

 // Fingers
 for(let i=0;i<4;i++){
  cylinderBetween(
   character,
   [x*.43+(i-1.5)*.018,1.07,.09],
   [x*.43+(i-1.5)*.022,1.00,.095],
   .012,.009,skin
  );
 }
}

// Legs
for(const side of [-1,1]){
 const x=side*.15;

 cylinderBetween(
  character,[x, .94,0],
  [x*1.05,.52,0],.105,.083,skin
 );

 sphere(character,x*1.05,.51,0,.085,.09,.09,skin);

 cylinderBetween(
  character,[x*1.05,.49,0],
  [x*1.08,.13,.015],.08,.065,skin
 );

 // Sneakers
 sphere(character,x*1.08,.09,.09,.105,.075,.20,white);
}

// HEAD
const head=new THREE.Group();
head.position.set(0,2.34,0);
character.add(head);

// Face base
sphere(head,0,0,0,.255,.345,.235,skin);

// Jaw and cheeks
sphere(head,0,-.15,.045,.21,.17,.20,skin);
sphere(head,-.19,-.025,.105,.085,.095,.10,skin);
sphere(head,.19,-.025,.105,.085,.095,.10,skin);

// Forehead
sphere(head,0,.20,.015,.22,.13,.205,skin);

// Ears
for(const side of [-1,1]){
 sphere(head,side*.25,-.025,0,.055,.09,.06,skin);
}

// Eyebrows
for(const side of [-1,1]){
 const brow=sphere(
  head,side*.105,.105,.209,.075,.018,.025,dark
 );
 brow.rotation.z=side*-.08;
}

// Eyes
for(const side of [-1,1]){
 sphere(head,side*.105,.045,.207,.078,.047,.027,white);
 sphere(head,side*.105,.045,.231,.030,.032,.013,iris);
 sphere(head,side*.105,.045,.242,.014,.022,.008,dark);
 sphere(head,side*.095,.058,.249,.008,.009,.004,white);
}

// Nose
sphere(head,0,-.035,.245,.038,.075,.045,skin);
sphere(head,0,-.085,.267,.048,.027,.034,skin);
sphere(head,-.027,-.087,.278,.018,.013,.013,skinDark);
sphere(head,.027,-.087,.278,.018,.013,.013,skinDark);

// Lips
sphere(head,0,-.145,.222,.072,.025,.025,lips);
sphere(head,0,-.166,.219,.061,.018,.022,skinDark);

// Chin
sphere(head,0,-.235,.09,.105,.06,.11,skin);

// HAIR
// Hair cap
sphere(head,0,.235,-.015,.265,.19,.245,hair);

// Back hair
sphere(head,0,-.08,-.17,.255,.36,.105,hair);
sphere(head,0,-.36,-.15,.24,.24,.09,hair);

// Side locks
for(const side of [-1,1]){
 const lock=sphere(
  head,side*.205,-.16,.015,.075,.34,.09,hair
 );
 lock.rotation.z=side*-.10;

 sphere(
  head,side*.21,-.37,.035,.065,.17,.07,hairLight
 );
}

// Hair front strands
for(const side of [-1,1]){
 const strand=sphere(
  head,side*.115,.20,.18,.045,.18,.07,hairLight
 );
 strand.rotation.z=side*.12;
}

// Necklace
const necklace=new THREE.Mesh(
 new THREE.TorusGeometry(.105,.006,8,40),
 metal
);
necklace.position.set(0,1.91,.18);
necklace.rotation.x=Math.PI/2;
character.add(necklace);

// Pendant
sphere(character,0,1.80,.19,.022,.035,.012,metal);

// Watch
cylinderBetween(
 character,[-.40,1.43,.015],[-.40,1.49,.015],
 .065,.065,dark
);

// Shoes details
for(const side of [-1,1]){
 for(let i=0;i<3;i++){
  cylinderBetween(
   character,
   [side*.162,.11,.04+i*.045],
   [side*.162,.11,.07+i*.045],
   .008,.008,metal
  );
 }
}

// Ground
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 material(0x303136)
);
floor.rotation.x=-Math.PI/2;
floor.position.y=0;
floor.receiveShadow=true;
scene.add(floor);

// Camera focus
controls.update();

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
